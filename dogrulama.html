<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Posta Doğrulandı | Dexter Dexigner</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #060607;
      --bg-panel: rgba(17, 17, 20, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent: #007AFF;
      --accent-hover: #0062CC;
      --text-primary: #FFFFFF;
      --text-secondary: #98989D;
      --glow-color: rgba(0, 122, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-base);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: var(--text-primary);
      overflow: hidden;
      position: relative;
    }

    /* Premium background mesh glow */
    .bg-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 122, 255, 0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      pointer-events: none;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      z-index: 2;
      animation: cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .logo-img {
      height: 70px;
      width: auto;
      margin-bottom: 24px;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.2s forwards;
    }

    .card {
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 45px 35px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.5), 
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    /* Animated Checkmark Wrapper */
    .success-icon-box {
      width: 72px;
      height: 72px;
      margin: 0 auto 28px auto;
      position: relative;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.3s forwards;
    }

    .success-icon-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 122, 255, 0.08);
      border-radius: 50%;
      box-shadow: 0 0 25px var(--glow-color);
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    /* Checkmark SVG Animation */
    .checkmark {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: block;
      stroke-width: 3;
      stroke: var(--accent);
      stroke-miterlimit: 10;
      animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s forwards;
      position: relative;
      z-index: 2;
    }

    .checkmark__circle {
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
      stroke-width: 3;
      stroke-miterlimit: 10;
      stroke: var(--accent);
      fill: none;
      animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
    }

    .checkmark__check {
      transform-origin: 50% 50%;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.4s forwards;
    }

    p {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 30px;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.5s forwards;
    }

    .app-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      padding: 11px 28px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
      transition: all 0.2s ease;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.6s forwards;
    }

    .app-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1.5px);
      box-shadow: 0 6px 16px rgba(0, 122, 255, 0.35);
    }

    .app-btn:active {
      transform: translateY(0);
    }

    /* Animations */
    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(15px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 20px rgba(0, 122, 255, 0.12);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 0 35px rgba(0, 122, 255, 0.25);
      }
    }

    @keyframes stroke {
      100% {
        stroke-dashoffset: 0;
      }
    }

    @keyframes scale {
      0%, 100% {
        transform: none;
      }
      50% {
        transform: scale3d(1.05, 1.05, 1);
      }
    }
  </style>
</head>
